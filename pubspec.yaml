name: tripgrok
description: A comprehensive Tourist Safety App with modern UI and advanced features
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Core dependencies
  intl: ^0.20.2
  shared_preferences: ^2.3.2

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # QR scanning (digital ID)
  mobile_scanner: ^3.5.6
  
  # Secure storage
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  
    # assets:
    #   - lib/l10n/
    #   - assets/images/
    #   - assets/icons/
    #   - assets/animations/
    #   - assets/sounds/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# Flutter configuration
flutter_gen:
  output: lib/generated/
  line_length: 80
  
  integrations:
    flutter_svg: true
    flare_flutter: true
    rive: true
    lottie: true

  assets:
    enabled: true
    package_parameter_enabled: true
    style: snake-case

  fonts:
    enabled: true

  colors:
    enabled: true
    inputs:
      - assets/colors/colors.xml
