name: tripgrok
description: A comprehensive Tourist Safety App with modern UI and advanced features
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Core dependencies
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  
  # Map and location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  
  # UI and animations
  lottie: ^3.1.2
  animated_text_kit: ^4.2.2
  flutter_staggered_animations: ^1.1.1
  
  # State management (optional - choose one)
  provider: ^6.1.2
  # riverpod: ^2.5.1
  # bloc: ^8.1.4
  
  # Utility packages
  connectivity_plus: ^6.0.5
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  
  # Local notifications
  flutter_local_notifications: ^17.2.2
  
  # QR Code generation (for digital ID)
  qr_flutter: ^4.1.0
  # qr_code_scanner: ^1.0.1
  mobile_scanner: ^3.5.6
  
  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  
  # HTTP requests
  http: ^1.2.2
  dio: ^5.7.0
  
  # Secure storage
  flutter_secure_storage: ^9.2.2
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Audio for alerts
  audioplayers: ^6.1.0
  
  # Haptic feedback
  # vibration: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  generate: true
  uses-material-design: true
  
    # assets:
    #   - lib/l10n/
    #   - assets/images/
    #   - assets/icons/
    #   - assets/animations/
    #   - assets/sounds/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# Flutter configuration
flutter_gen:
  output: lib/generated/
  line_length: 80
  
  integrations:
    flutter_svg: true
    flare_flutter: true
    rive: true
    lottie: true

  assets:
    enabled: true
    package_parameter_enabled: true
    style: snake-case

  fonts:
    enabled: true

  colors:
    enabled: true
    inputs:
      - assets/colors/colors.xml